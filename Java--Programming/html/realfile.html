<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <title>Edu-Tracker Dashboard</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      background: #f7f9fc;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 1400px;
      margin: 30px auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
      font-size: 2rem;
      color: #5a4fcf;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
    }

    .card {
      background: #fff;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.08);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
    }

    .card h3 {
      margin-top: 0;
      font-size: 1.2rem;
      color: #333;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .summary-box {
      margin: 15px 0;
      padding: 15px;
      border-radius: 12px;
      background: #f4f6ff;
      color: #333;
      font-size: 16px;
      line-height: 1.6;
      font-weight: 540;
    }

    .summary-box div {
      margin: 4px 0;
      padding: 6px 10px;
      border-radius: 8px;
      background: #fff;
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.05);
    }

    button {
      margin-top: 10px;
      padding: 10px 15px;
      background: #5a4fcf;
      border: none;
      border-radius: 8px;
      color: #fff;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: background 0.2s ease;
    }

    button:hover {
      background: #4338ca;
    }

    #main-area {
      margin-top: 30px;
      padding: 20px;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.08);
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Edu-Tracker</h1>

    <div class="cards">
      <div class="card" id="card-attendance">
        <h3>📘 Attendance Details</h3>
        <div id="attendance-summary" class="summary-box">Loading...</div>
        <button onclick="viewDetails('attendance')">View Details</button>
      </div>

      <div class="card" id="card-assignments">
        <h3>📝 Assignments</h3>
        <div id="assignments-summary" class="summary-box">Loading...</div>
        <button onclick="viewDetails('assignments')">Manage Assignments</button>
      </div>

      <div class="card" id="card-cgpa">
        <h3>📊 CGPA</h3>
        <div id="cgpa-summary" class="summary-box">Loading...</div>
        <button onclick="viewDetails('cgpa')">Calculate CGPA</button>
      </div>
    </div>

    <div id="main-area"></div>
  </div>

  <script src="/js/app.js"></script>
</body>

</html>
